# Sitio web del 48º Foro Internacional de Música Nueva Manuel Enríquez.
#
# El contenido (conciertos, agenda, sedes, Coloquio, créditos) lo genera
# sitio/genera.sh a partir de fimnme2026-programa.md, el mismo Markdown del
# Programa general: no se edita aquí, sino en el Markdown.

title: "48º Foro Internacional de Música Nueva Manuel Enríquez"
titulo_corto: "48º FIMNME"
description: >-
  Programación completa del 48º Foro Internacional de Música Nueva Manuel
  Enríquez: conciertos, actividades académicas y Coloquio Enríquez | 100.
  Del 6 al 21 de noviembre de 2026.
lang: es-MX
# Dominio donde se publica (se usa en los enlaces para compartir en redes, en
# los QR de descargas y en el boletín). El de prueba era
# https://fimnme.qumran.cc (ver DESPLIEGUE.md).
url: "https://forodemusicanueva.inba.gob.mx"
# El año de la edición va en todas las direcciones (…/2026/programacion/): así
# las ediciones pueden convivir en el mismo dominio. genera.sh compila el
# sitio en _site/2026/ y deja en la raíz una redirección a esta edición.
baseurl: "/2026"
# Venta del abono (inauguración y clausura), en Ticketmaster: la portada, las
# páginas de esos dos conciertos y el boletín llevan a esta dirección
abono_boletos: "https://www.ticketmaster.com.mx/evento-abono-46-fimnme-osn-inaugural-mexico-cdmx-06-11-2026/event/3D0065290920972A"
# Venta de boletos de los conciertos con costo (Sala Manuel M. Ponce, MUAC,
# OJUEM y Cepromusic en el Anfiteatro Simón Bolívar; los precios están en
# sitio/sitio.lua): la etiqueta del evento y su liga. Mientras un concierto no
# tenga liga, el botón «Comprar boleto» de su página sale inactivo. Por ejemplo:
#   dom-nov-8-ojuem-arean-rosado: "https://www.ticketmaster.com.mx/…"
boletos_compra:
  # Sala Manuel M. Ponce
  mar-nov-10-alberto-rosado-piano: "https://www.ticketmaster.com.mx/coordinacion-nacional-de-musica-y-opera-mexico-10-11-2026/event/3D006552B24C4F7A"
  sab-nov-14-duo-gasparini-monnet: "https://www.ticketmaster.com.mx/coordinacion-nacional-de-musica-y-opera-mexico-14-11-2026/event/3D006552B24E4F85"
  vie-nov-13-coro-de-madrigalistas-de-bellas-artes-cadet: "https://www.ticketmaster.com.mx/coordinacion-nacional-de-musica-y-opera-mexico-15-11-2026/event/3D006552B2504F88"   # la función del domingo 15
  mie-nov-18-francisco-garcia-torres-enriquez-100: "https://www.ticketmaster.com.mx/coordinacion-nacional-de-musica-y-opera-mexico-18-11-2026/event/3D006552B2524F93"
  jue-nov-19-ocba: "https://www.ticketmaster.com.mx/ocba-orq-de-camara-de-bellas-mexico-19-11-2026/event/3D0064FEC7816330"
  sab-nov-21-cuarteto-de-bellas-artes-enriquez-100: "https://www.ticketmaster.com.mx/coordinacion-nacional-de-musica-y-opera-mexico-21-11-2026/event/3D006552B2534F9C"
  sab-nov-21-ensamble-sonus: "https://www.ticketmaster.com.mx/coordinacion-nacional-de-musica-y-opera-mexico-21-11-2026/event/3D006552B2544F9E"
# Suscripción al boletín de noticias del FIMNME (formulario de Brevo): la
# portada, el pie de todas las páginas y el boletín por correo llevan a él
boletin_suscripcion: "https://1f5ec740.sibforms.com/serve/MUIFAJ0dwFW6FBPKjmSS9naxPn0RHuMMQhwHzdCzWVIgSkTHkGuzhKcBysPx3hXp19AkxtCIWzfz_NDzl8iQMUirZUV4wSn6KIaGsRMVmof5XQThHEwb3YMgfPukrvRh9G0sAFBZ0a6aVTZ2OgmHLuo238K5q4T7IaGp4Fh8xAoBcudwnX98G3cEtvXuSga1zvwy1ADNTZvoogfUjQ=="
# true en el dominio definitivo. En un sitio de prueba, false: pide a los
# buscadores que no lo indexen (robots.txt y <meta name="robots">).
indexar: true
timezone: America/Mexico_City
permalink: pretty

collections:
  conciertos:
    output: true
    permalink: /conciertos/:name/
    sort_by: orden

defaults:
  - scope: { path: "", type: conciertos }
    values: { layout: evento }
  - scope: { path: "" }
    values: { layout: pagina }

exclude:
  - genera.sh
  - sitio.lua
  - recursos.py
  - Gemfile
  - Gemfile.lock
  - README.md
  - DESPLIEGUE.md
  - publicar.sh
  - vendor
