---
layout: base
---
<header class="banda">

    {%- if page.antetitulo %}<p class="banda-ante">{{ page.antetitulo }}</p>{% endif %}

    {%- if page.entrada %}<p class="banda-entrada">{{ page.entrada }}</p>{% endif %}

</header>
<div class="contenedor pagina-cuerpo">
  {{ content }}
</div>
