  - |
    \newsavebox\fotobox
    \newlength{\fotow}
    \newlength{\fotoh}
    \newcommand{\circulofoto}[1]{%
      \savebox\fotobox{\includegraphics{\detokenize{#1}}}%
      \settowidth{\fotow}{\usebox{\fotobox}}%
      \settoheight{\fotoh}{\usebox{\fotobox}}%
      \begin{tikzpicture}[baseline=(c.center)]
        \node[
          circle,
          draw=none,
          minimum size=2.2cm,
          inner sep=0pt,
          path picture={%
            \node at (path picture bounding box.center) {%
              \ifdim\fotow>\fotoh
                % Apaisada / Ancha: escala al alto del círculo (más margen de cobertura)
                \includegraphics[height=2.3cm,keepaspectratio]{\detokenize{#1}}%
              \else
                % Vertical / Retrato: escala al ancho del círculo
                \includegraphics[width=2.3cm,keepaspectratio]{\detokenize{#1}}%
              \fi
            };
          }
        ] (c) {};
      \end{tikzpicture}%
    }
  - |
    \makeatletter
    \newcommand{\fotopar}[1]{%
      \hangafter=0\hangindent=2.6cm\noindent
      \llap{%
        \raisebox{\dimexpr -2.5\baselineskip\relax}[0pt][0pt]{%
          \circulofoto{#1}%
        }%
        \hspace*{4mm}%
      }%
      \ignorespaces
    }
    \makeatother
