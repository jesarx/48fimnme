# Postales de los eventos del 48º FIMNME (1080 × 1350 px, para redes). Parten
# de las postales del diseñador; la plantilla es postales/postal.tex.
#
# Cada postal toma del Markdown (a través de sitio/_conciertos/<evento>.html,
# que genera sitio/genera.sh) la fecha, la hora, la sede, la dirección,
# «Obras de…» y los logotipos del evento. Aquí van los datos editoriales y, si
# hace falta, lo que se quiera cambiar de lo anterior.
#
#   evento        etiqueta del evento (la del Programa general y del sitio)
#   funcion       (opcional) en un evento con varias funciones, cuál (1, 2…):
#                 cada función lleva su postal, con su fecha y su sede
#   antetitulo    primer renglón (si no se indica, «Concierto»)
#   titulo        (opcional) título del concierto (el nombre del programa, el
#                 de un maratón, la obra de una instalación): va bajo el
#                 antetítulo y sobre la fecha
#   subtitulo     (opcional) su segunda parte, más chica
#   interpretes   lista de nombres o de [nombre, papel]
#   obras         (opcional) en lugar de «Obras de…» del programa
#   nota          (opcional) renglón bajo las obras (una colaboración…);
#                 «\n» (entre comillas) cambia de renglón, aquí y en la entrada
#   (en las postales no hay cursivas)
#   fotos         hasta cuatro (de int/ o comp/), en la franja de arriba, de
#                 izquierda a derecha. Cada una es la ruta o, para afinarla,
#                 {archivo: ruta, recorte: [x0, y0, x1, y1], peso: n,
#                 extender: [i, a, d, b]}:
#                 «recorte», la parte de la foto que se usa (en fracciones,
#                 de 0 a 1; p. ej. para poner en dos marcos una foto que son
#                 dos retratos); «peso», cuánto más ancho es su marco que
#                 el de las otras (1.6: un 60 % más; para darle prioridad),
#                 y «extender», [izquierda, arriba, derecha, abajo], más fondo
#                 alrededor (fracciones de la foto; para fotos de estudio con
#                 fondo liso en las que el grupo no cabe sin cortar cabezas)
#   franja        (opcional) alto mínimo de la franja de fotos, en mm, si el
#                 que se calcula con los rostros no basta (el texto se achica
#                 hasta el 82 % para dejarle lugar)
#   foco          (opcional) punto de interés de cada foto, [x, y] de 0 a 1;
#                 si no se indica, se centra en los rostros (o en el de la
#                 lista «focos», al final, que vale para todas las postales)
#   sin_logos     (opcional) logotipos del evento que no van en esta postal
#                 (partes de su ruta en el Markdown; p. ej. los de la sede de
#                 la otra función)
#   entrada       (opcional) en lugar de «Entrada libre | Cupo limitado»
#                 (p. ej. el precio de la inauguración o la clausura)
#   fecha, sede, direccion   (opcionales) en lugar de las del programa
#
# Van en este orden: estados, Ciudad de México, actividades académicas,
# Coloquio y Ecos del Foro (las actividades y el Coloquio, con fondo verde azulado).

