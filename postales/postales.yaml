# Postales de los eventos del 48.º FIMNME (1080 × 1350 px, para redes), con el
# diseño de las postales del diseñador.
#
# Cada postal toma del Markdown (a través de sitio/_conciertos/<evento>.html,
# que genera sitio/genera.sh) la fecha, la hora, la sede, la dirección,
# «Obras de…» y los logotipos del evento. Aquí van los datos editoriales y, si
# hace falta, lo que se quiera cambiar de lo anterior.
#
#   evento        etiqueta del evento (la del Programa general y del sitio)
#   antetitulo    renglón sobre la fecha (si no se indica, «Concierto»)
#   interpretes   lista de nombres o de [nombre, papel]
#   obras         (opcional) en lugar de «Obras de…» del programa; *cursivas*
#                 solo para los títulos de las obras
#   fotos         hasta cuatro, en círculo (de int/ o comp/), de arriba abajo
#   foco          (opcional) punto de interés de cada foto, [x, y] de 0 a 1;
#                 si no se indica, se centra en los rostros
#   entrada       (opcional) en lugar de «Entrada libre | Cupo limitado»
#                 (p. ej. el precio de la inauguración o la clausura)
#   fecha, sede, direccion   (opcionales) en lugar de las del programa

postales:
  - evento: vie-nov-6-xalapa-osx
    interpretes:
      - Orquesta Sinfónica de Xalapa
      - [Martin Lebel, director]
      - [Gabriela Flores, mezzosoprano]
      - [Armando Gama, barítono]
    fotos:
